apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
# The app never calls the Kubernetes API
automountServiceAccountToken: false
