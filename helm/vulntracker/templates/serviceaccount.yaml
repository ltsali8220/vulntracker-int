apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
  {{- if eq .Values.secrets.provider "aws" }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.secrets.aws.roleArn | quote }}
  {{- end }}
# The app never calls the Kubernetes API. The secrets provider requests its
# own short-lived token for this account, so none is mounted into the pod.
automountServiceAccountToken: false
