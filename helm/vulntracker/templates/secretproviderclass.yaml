apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "vulntracker.fullname" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.provider }}
  parameters:
    objects: |
      - objectName: {{ .Values.secrets.awsSecretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          {{- range .Values.secrets.objects }}
          - path: {{ .jmesPath | quote }}
            objectAlias: {{ .fileName | quote }}
          {{- end }}
