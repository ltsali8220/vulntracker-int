apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "vulntracker.fullname" . }}
  namespace: {{ include "vulntracker.namespace" . }}
  labels:
    {{- include "vulntracker.labels" . | nindent 4 }}
spec:
  provider: {{ .Values.secrets.provider }}
  parameters:
    {{- if eq .Values.secrets.provider "vault" }}
    {{- with .Values.secrets.vault }}
    # The provider logs in to Vault with the pod's service-account token
    # (Kubernetes auth method) and reads only the paths the role allows.
    vaultAddress: {{ .address | quote }}
    roleName: {{ .role | quote }}
    vaultKubernetesMountPath: {{ .kubernetesMountPath | quote }}
    {{- if .audience }}
    audience: {{ .audience | quote }}
    {{- end }}
    {{- if .caCertPath }}
    vaultCACertPath: {{ .caCertPath | quote }}
    {{- end }}
    objects: |
      - objectName: {{ $.Values.secrets.fileName | quote }}
        secretPath: {{ .secretPath | quote }}
        secretKey: {{ .secretKey | quote }}
    {{- end }}
    {{- else if eq .Values.secrets.provider "aws" }}
    objects: |
      - objectName: {{ .Values.secrets.aws.secretName | quote }}
        objectType: "secretsmanager"
        jmesPath:
          - path: {{ .Values.secrets.aws.jmesPath | quote }}
            objectAlias: {{ .Values.secrets.fileName | quote }}
    {{- else }}
    {{- fail "secrets.provider must be \"vault\" or \"aws\"" }}
    {{- end }}
