# SQLite on a ReadWriteOnce volume supports a single writer only.
# Scale out only after moving to a managed database (see docs/remediation-plan.md).
replicaCount: 1

# Dedicated namespace (never "default"); create it with Pod Security Admission
# labels, e.g. pod-security.kubernetes.io/enforce=restricted
namespace: vulntracker

image:
  repository: ghcr.io/example/vulntracker-api
  # Immutable digest of the image built and scanned by CI. The chart refuses to
  # render without one. Override per release: --set image.digest=sha256:...
  # (Placeholder: the local build's image ID; replace with the registry digest.)
  digest: "sha256:9c808a86fb9cc91f893cda20b6118ad40579528073c4a85f22ceeb90c525e9f3"
  pullPolicy: Always

nameOverride: ""
fullnameOverride: ""

# Non-secret runtime configuration
config:
  shareBaseUrl: "https://vulntracker.example.com"
  notifyServiceUrl: "http://vulntracker-notify:3001"
  corsAllowedOrigins: "https://vulntracker.example.com"

# Secrets are fetched at pod start by the Secrets Store CSI driver and mounted
# as read-only files. They never appear in this chart, in a Kubernetes Secret
# object, or in environment variables. The app reads the file named by
# SECRET_KEY_FILE.
secrets:
  # "vault" = on-prem HashiCorp Vault (default), "aws" = AWS Secrets Manager
  provider: vault
  mountPath: /mnt/secrets
  fileName: jwt_secret_key

  vault:
    # Vault server address as seen from the cluster nodes (the CSI provider
    # runs on each node and talks to Vault; the app pod never does)
    address: "https://vault.internal.example.com:8200"
    # Vault Kubernetes-auth role bound to this chart's service account and
    # namespace, with a read-only policy on secretPath
    role: vulntracker-api
    kubernetesMountPath: kubernetes
    # Audience of the service-account token sent to Vault; must match the
    # role's "audience" so a token issued for anything else is rejected
    audience: vault
    # KV version 2 path (note the /data/ segment) and the key inside it
    secretPath: "secret/data/vulntracker/api"
    secretKey: jwt_secret_key
    # Path (on the node) of the CA that signed Vault's TLS certificate; empty
    # uses the system trust store
    caCertPath: ""

  aws:
    # Secret name in AWS Secrets Manager and the JSON key inside it
    secretName: "prod/vulntracker/api"
    jmesPath: jwt_secret_key
    # IAM role (IRSA) allowed secretsmanager:GetSecretValue on that secret only
    roleArn: "arn:aws:iam::123456789012:role/vulntracker-api-secrets-read"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: nginx
  host: vulntracker.example.com
  tlsSecretName: vulntracker-tls
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    # Edge rate limiting: compensating control for login / share-link brute force
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"

networkPolicy:
  # Pods allowed to reach the API: only the ingress controller
  ingressControllerNamespace: ingress-nginx
  ingressControllerPodLabels:
    app.kubernetes.io/name: ingress-nginx
  # Egress allowed only to DNS and the notification service
  notifyPodLabels:
    app.kubernetes.io/name: vulntracker-notify
  notifyPort: 3001

persistence:
  size: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
