name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Least privilege for the workflow token
permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tags are mutable).
# Scanner images are pinned to exact versions so results are reproducible.
env:
  SEMGREP_VERSION: "1.181.1"
  BANDIT_VERSION: "1.9.4"
  PIP_AUDIT_VERSION: "2.10.1"
  TRIVY_IMAGE: "aquasec/trivy:0.76.1"
  CHECKOV_IMAGE: "bridgecrew/checkov:3.3.30"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"
  SEMGREP_RULES: "--config p/python --config p/secrets --config p/security-audit --config p/javascript --config p/nodejs"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

  test-notify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install dependencies
        # npm ci installs exactly what package-lock.json pins and verifies integrity hashes
        run: npm ci
        working-directory: notify

      - name: Run tests
        run: npm test
        working-directory: notify

  # -------------------------------------------------------------------------
  # SAST: Semgrep (multi-language rules for Python + Node) and Bandit
  # (Python-specific). Fails the build on high/critical code findings.
  # Gitleaks checks the working tree for committed secrets.
  # -------------------------------------------------------------------------
  sast:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install scanners
        run: pip install "semgrep==${SEMGREP_VERSION}" "bandit==${BANDIT_VERSION}"

      - name: Semgrep report
        run: |
          mkdir -p out
          semgrep scan --metrics=off $SEMGREP_RULES --json --output out/sast.semgrep.json app notify/src

      - name: Bandit report
        run: bandit -r app -f json -o out/sast.bandit.json --exit-zero

      - name: Secret scan (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" dir /repo \
            --config /repo/.gitleaks.toml --no-banner \
            --report-format json --report-path /repo/out/secrets.gitleaks.json

      - name: Upload SAST reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sast.semgrep.json
          path: out/

      - name: Fail on high/critical findings
        run: |
          # Semgrep ERROR = high/critical; Bandit HIGH severity
          semgrep scan --metrics=off $SEMGREP_RULES --severity ERROR --error --quiet app notify/src
          bandit -r app --severity-level high --confidence-level medium -q

  # -------------------------------------------------------------------------
  # SCA: pip-audit (PyPA, PyPI advisory + OSV data) for Python, npm audit for
  # the notify service. Fails on critical/high CVEs.
  # -------------------------------------------------------------------------
  sca:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install pip-audit
        run: pip install "pip-audit==${PIP_AUDIT_VERSION}"

      - name: pip-audit (Python dependencies)
        # pip-audit has no severity filter, so it fails on ANY known
        # vulnerability: stricter than the critical/high requirement.
        run: |
          mkdir -p out
          pip-audit -r requirements-dev.txt --desc --format json --output out/sca.pip-audit.json

      - name: npm audit (notify dependencies)
        working-directory: notify
        run: |
          npm ci --ignore-scripts
          npm audit --json > ../out/sca.npm-audit.json || true
          npm audit --audit-level=high

      - name: Upload SCA reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sca.pip-audit.json
          path: out/

  # -------------------------------------------------------------------------
  # Container: build the image, scan OS packages, Python libraries, secrets
  # and Dockerfile misconfigurations with Trivy. Fails on fixable CRITICALs.
  # -------------------------------------------------------------------------
  container-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image
        run: docker build -t vulntracker-api:${{ github.sha }} .

      - name: Smoke test (non-root, healthy)
        run: |
          docker run -d --name vt -p 8000:8000 --read-only --tmpfs /tmp --tmpfs /data:rw,mode=1777 \
            -e SECRET_KEY="$(openssl rand -base64 48)" vulntracker-api:${{ github.sha }}
          for i in $(seq 1 20); do curl -fs localhost:8000/health && break; sleep 2; done
          test "$(docker exec vt id -u)" = "65532"
          docker rm -f vt

      - name: Trivy report
        run: |
          mkdir -p out
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/out:/out" "$TRIVY_IMAGE" \
            image --scanners vuln,secret,misconfig --format json --output /out/container.trivy.json \
            vulntracker-api:${{ github.sha }}

      - name: Upload container report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container.trivy.json
          path: out/container.trivy.json

      - name: Fail on fixable critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" \
            image --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1 \
            vulntracker-api:${{ github.sha }}

  # -------------------------------------------------------------------------
  # IaC: Checkov renders the Helm chart and checks the Kubernetes manifests
  # (security contexts, limits, network policy, image digests, ...).
  # -------------------------------------------------------------------------
  iac-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Checkov (fails on any failed check)
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/src" -w /src "$CHECKOV_IMAGE" \
            -d helm --framework helm --compact -o json > out/iac.checkov.json \
            || { python3 -c "import json;d=json.load(open('out/iac.checkov.json'));print(json.dumps(d['summary']));[print(f['check_id'],f['resource']) for f in d['results']['failed_checks']]"; exit 1; }

      - name: Upload IaC report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iac.checkov.json
          path: out/
